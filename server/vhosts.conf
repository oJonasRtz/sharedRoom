<VirtualHost *:80>
	ServerName localhost

	ProxyPreserveHost On

	Redirect permanent / https://localhost/
</VirtualHost>

# Config Https later
<VirtualHost *:443>
	SSLEngine on
	SSLCertificateFile /certs/server.cert
	SSLCertificateKeyFile /certs/server.key

	SSLProxyEngine On
	ProxyPreserveHost On

	ProxyPass "/" "http://web:5117/"
	ProxyPassReverse "/" "http://web:5117/"
</VirtualHost>

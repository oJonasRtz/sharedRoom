services:
  web:
    build:
      context: ./MusicRooms.Web
    image: musicrooms-web:latest
    networks:
      - "musicrooms-network"
    restart: unless-stopped

  api:
    build:
      context: ./MusicRooms.Api
    image: musicrooms-api:latest
    networks:
      - "musicrooms-network"
    restart: unless-stopped

  apache:
    image: httpd:latest
    networks:
      - "musicrooms-network"
    volumes:
      - ./server/httpd.conf:/usr/local/apache2/conf/httpd.conf
      - ./server/vhosts.conf:/usr/local/apache2/conf/extra/vhosts.conf
      - ./server/certs:/certs:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://apache:80
    restart: unless-stopped
    networks:
      - musicrooms-network

networks:
  musicrooms-network:
    driver: bridge
